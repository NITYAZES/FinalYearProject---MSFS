<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Success</title>
    <link rel="stylesheet" href="css/reset_success.css">
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <div class="checkmark"></div>
        </div>

        <h1>Check Your Email</h1>
        
        <p class="message">
            A password reset link has been sent to your email address.
        </p>

        <div class="info-box">
            <p>📧 <strong>What to do next:</strong></p>
            <p>1. Check your inbox (and spam folder)</p>
            <p>2. Click the reset link in the email</p>
            <p>3. Create your new password</p>
        </div>

        <a href="index.html" class="btn-back">Back to Login</a>

        <div class="footer">
            <p>The link expires in 30 minutes for security reasons.</p>
        </div>
    </div>

    <script src="js/reset_success.js"></script>
</body>
</html>
