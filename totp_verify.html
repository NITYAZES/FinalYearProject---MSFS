<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Two-Factor Authentication</title>
    <link rel="stylesheet" href="./css/totp_verify.css" />
</head>
<body>
    <div class="totp-verify-container">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h2>Two-Factor Authentication</h2>
        <p>Enter the 6-digit code from your authenticator app</p>

        <div id="feedback-message" role="alert" aria-live="assertive"></div>

        <!-- MAIN TOTP FORM -->
        <form id="totp-form">
            <input 
                type="text" 
                id="totp-code" 
                class="code-input"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                required
                autocomplete="off"
                autofocus
            >
            <button type="submit" class="btn submit-btn" id="verify-btn">
                <span id="submit-text">Verify</span>
            </button>
        </form>

        <a href="#" class="backup-link" id="use-backup-link">Use a backup code instead</a>

        <!-- BACKUP CODE SECTION (HIDDEN BY DEFAULT IN CSS) -->
        <div class="backup-section" id="backup-section">
            <h3 style="font-size: 18px; margin-bottom: 10px;">Enter Backup Code</h3>
            <form id="backup-verify-form">
                <input 
                    type="text" 
                    id="backup-code" 
                    class="code-input"
                    placeholder="XXXX-XXXX"
                    maxlength="9"
                    style="letter-spacing: 2px;"
                    autocomplete="off"
                >
                <button type="submit" class="btn">
                    <span>Verify Backup Code</span>
                </button>
            </form>
            <a href="#" class="backup-link" id="back-to-totp">Back to authenticator code</a>
        </div>

        <a href="./index.html" class="back-to-login" id="back-to-login-link">← Back to Login</a>
    </div>

    <script src="./js/totp_verify.js"></script>
</body>
</html>
