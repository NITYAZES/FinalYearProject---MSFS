<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - Secure File Share</title>
    <link rel="stylesheet" href="./css/change_password.css" />
  </head>
  <body>
    <div class="container">
      <div class="title-wrapper">
        <div class="brand-logo"></div>
        <h1>Change Your Password</h1>
        <p class="subtitle">
          Your encryption keys will be securely re-encrypted with your new
          password.
        </p>
      </div>

      <div id="message" class="message"></div>

      <form id="changePasswordForm" novalidate>
        <!-- CURRENT PASSWORD -->
        <div class="form-group">
          <label for="current_password">Current Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="current_password"
              name="current_password"
              placeholder="Enter current password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="toggle-current-btn"
              class="toggle-password"
              aria-label="Show password"
            >
              <svg
                class="eye-closed"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg
                class="eye-open"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
                style="display: none"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- NEW PASSWORD -->
        <div class="form-group">
          <label for="new_password">New Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="new_password"
              name="new_password"
              placeholder="Enter new password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              id="toggle-new-btn"
              class="toggle-password"
              aria-label="Show password"
            >
              <svg
                class="eye-closed"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg
                class="eye-open"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
                style="display: none"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- CONFIRM NEW PASSWORD -->
        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Re-enter new password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              id="toggle-confirm-btn"
              class="toggle-password"
              aria-label="Show confirm password"
            >
              <svg
                class="eye-closed"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg
                class="eye-open"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
                style="display: none"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- PASSWORD REQUIREMENTS -->
        <div class="password-requirements">
          <div class="requirement" id="req-length">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>At least 12 characters</span>
          </div>

          <div class="requirement" id="req-letter">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>At least 1 letter</span>
          </div>

          <div class="requirement" id="req-number">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>At least 1 number</span>
          </div>

          <div class="requirement" id="req-different">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>Different from current password</span>
          </div>

          <div class="requirement" id="req-match">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>Passwords match</span>
          </div>

          <div class="requirement" id="req-not-similar">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>Not similar to name, username, or email</span>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>
          Change Password
        </button>
      </form>

      <div class="back-link">
        <a href="dashboard_user.html">← Back to Dashboard</a>
      </div>
    </div>

    <script src="js/change_password.js" defer></script>
  </body>
</html>
